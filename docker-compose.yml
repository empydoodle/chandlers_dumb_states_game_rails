services:
  dev-web:                                                                                 ## application container ref
    build:
      context: .                                                                       ## use local app dir
      dockerfile: Dockerfile.dev                                                      ## use local Dockerfile generated by rails
    command: bash -c "rm -f /tmp/pids/server.pid && bundle exec rails s -b '0.0.0.0'"  ## start rails server
    volumes:
      - .:/rails                                                                       ## default rails container app dir
    environment:
      RAILS_ENV: development                                                           ## set development env
      APPLICATION_HOSTS: localhost:8007, empydoodle-dt:8007                            ## permitted hosts for config.hosts
    ports:
      - "8007:3000"                                                                    ## allow us to access app on port 8008
    networks:
      - dev-network
networks:
  dev-network:
